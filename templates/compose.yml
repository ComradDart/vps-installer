# Tokens are replaced by helpers/render.py; no .env or administrative secrets.
services:
  xui:
    image: '@@XUI_IMAGE@@'
    container_name: vps-xui
    hostname: xui
    restart: unless-stopped
    entrypoint: ['/app/x-ui']
    environment:
      XUI_ENABLE_FAIL2BAN: 'false'
      TZ: 'UTC'
    volumes:
      - '@@ROOT@@/db:/etc/x-ui'
      - '@@ROOT@@/xray-logs:/var/log/x-ui'
    ports:
      - '127.0.0.1:2053:2053/tcp'
@@TELEMT_SOCKS@@
@@XUI_PUBLIC_TLS@@
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    networks: [proxy]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sS --max-time 3 -o /dev/null http://127.0.0.1:2053/ && (pidof xray-linux-amd64 || pidof xray-linux-arm64)']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: &logging
      driver: local
      options: {max-size: '10m', max-file: '3'}
  nginx:
    image: '@@NGINX_IMAGE@@'
    container_name: vps-nginx
    user: '101:101'
    entrypoint: ['nginx', '-g', 'daemon off;']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    sysctls:
      net.ipv4.ip_unprivileged_port_start: '0'
    volumes:
      - '@@ROOT@@/nginx.conf:/etc/nginx/nginx.conf:ro'
      - '@@ROOT@@/conf.d:/etc/nginx/conf.d:ro'
      - '@@ROOT@@/site:/usr/share/nginx/html:ro'
      - '@@ROOT@@/acme:/var/www/acme:ro'
      - '@@ROOT@@/tls:/etc/nginx/tls:ro'
    tmpfs:
      - '/tmp:uid=101,gid=101,mode=0700'
      - '/var/cache/nginx:uid=101,gid=101,mode=0700'
    ports:
      - '0.0.0.0:80:80/tcp'
@@NGINX_PUBLIC_TLS@@
      - '127.0.0.1:8443:8443/tcp'
    networks: [proxy]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', '-o', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging
networks:
  proxy:
    name: vps-installer-proxy
    enable_ipv6: false
    driver: bridge
    ipam:
      config: [{subnet: '@@SUBNET@@'}]
