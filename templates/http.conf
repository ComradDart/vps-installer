server {
    listen 80 default_server;
    server_name @@DOMAIN@@;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://@@DOMAIN@@$request_uri; }
}
